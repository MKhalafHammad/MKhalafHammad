<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-label="Mohamed K. Hammad, security infrastructure engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .name {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 42px;
      font-weight: 600;
      letter-spacing: -0.8px;
      fill: #e6edf3;
    }
    .role {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
      font-size: 17px;
      fill: #8ba3b8;
    }
    .src   { r: 3; fill: #2d465c; }
    .rail  { fill: none; stroke: #1e3040; stroke-width: 1.5; }
    .flow  { fill: none; stroke: #4ec9b0; stroke-width: 1.5; stroke-dasharray: 2 46; }
    .f1 { animation: dash 3.2s linear infinite; }
    .f2 { animation: dash 4.4s linear infinite; }
    .f3 { animation: dash 2.6s linear infinite; }
    .ring { fill: none; stroke: #f0a14b; stroke-width: 1.5; animation: ping 2.8s ease-out infinite; }

    @keyframes dash { to { stroke-dashoffset: -48; } }
    @keyframes ping {
      0%   { r: 7;  opacity: 0.9; }
      70%  { r: 20; opacity: 0; }
      100% { r: 20; opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .f1, .f2, .f3, .ring { animation: none; }
      .ring { opacity: 0.4; }
    }
  </style>

  <rect width="1000" height="240" rx="10" fill="#101a26"/>
  <rect x="0.5" y="0.5" width="999" height="239" rx="10" fill="none" stroke="#24384a"/>

  <text class="name" x="56" y="88">Mohamed K. Hammad</text>
  <text class="role" x="56" y="122">Security infrastructure engineer working on SIEM, detection, and network architecture</text>

  <g>
    <circle class="src" cx="58" cy="162"/>
    <circle class="src" cx="58" cy="184"/>
    <circle class="src" cx="58" cy="206"/>

    <path class="rail" d="M 68 162 H 812 Q 876 162 898 184"/>
    <path class="rail" d="M 68 184 H 898"/>
    <path class="rail" d="M 68 206 H 812 Q 876 206 898 184"/>

    <path class="flow f1" d="M 68 162 H 812 Q 876 162 898 184"/>
    <path class="flow f2" d="M 68 184 H 898"/>
    <path class="flow f3" d="M 68 206 H 812 Q 876 206 898 184"/>

    <circle class="ring" cx="912" cy="184" r="7"/>
    <circle cx="912" cy="184" r="6" fill="#f0a14b"/>
  </g>
</svg>
